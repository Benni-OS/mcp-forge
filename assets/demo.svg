<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGradForge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadowForge" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00C853" flood-opacity="0.2"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .terminal-text {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
        font-size: 13.5px;
        line-height: 22px;
      }
      .c-dim { fill: #6E7681; }
      .c-white { fill: #F0F6FC; }
      .c-blue { fill: #0066FF; font-weight: 700; }
      .c-green { fill: #00C853; font-weight: 700; }
      .c-yellow { fill: #FFBD2E; font-weight: 600; }
      .c-purple { fill: #A855F7; }

      @keyframes cycleAnim {
        0% { opacity: 0; transform: translateY(4px); }
        3% { opacity: 1; transform: translateY(0); }
        92% { opacity: 1; transform: translateY(0); }
        98% { opacity: 0; transform: translateY(-2px); }
        100% { opacity: 0; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blink 1s infinite;
        fill: #00C853;
      }

      .anim-l0 { animation: cycleAnim 13s ease infinite; animation-delay: 0.1s; }
      .anim-l1 { animation: cycleAnim 13s ease infinite; animation-delay: 1.0s; }
      .anim-l2 { animation: cycleAnim 13s ease infinite; animation-delay: 2.1s; }
      .anim-l3 { animation: cycleAnim 13s ease infinite; animation-delay: 3.2s; }
      .anim-l4 { animation: cycleAnim 13s ease infinite; animation-delay: 4.4s; }
      .anim-l5 { animation: cycleAnim 13s ease infinite; animation-delay: 5.5s; }
      .anim-l6 { animation: cycleAnim 13s ease infinite; animation-delay: 6.7s; }
      .anim-l7 { animation: cycleAnim 13s ease infinite; animation-delay: 7.8s; }
      .anim-l8 { animation: cycleAnim 13s ease infinite; animation-delay: 8.9s; }
      .anim-l9 { animation: cycleAnim 13s ease infinite; animation-delay: 10.0s; }
    </style>
  </defs>

  <!-- Terminal Window Outer Frame -->
  <rect x="10" y="10" width="860" height="450" rx="12" ry="12" fill="#0A0F0D" stroke="#00C853" stroke-width="1.5" stroke-opacity="0.5" filter="url(#shadowForge)"/>

  <!-- Titlebar -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 858 10 C 864.63 10 870 15.37 870 22 L 870 46 L 10 46 Z" fill="#101B14"/>
  <line x1="10" y1="46" x2="870" y2="46" stroke="#1C2E23" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="32" cy="28" r="6" fill="#FF5F56"/>
  <circle cx="52" cy="28" r="6" fill="#FFBD2E"/>
  <circle cx="72" cy="28" r="6" fill="#27C93F"/>

  <!-- Title text -->
  <text x="440" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8B949E" font-weight="500">
    mcp-forge — FastAPI-style declarative MCP framework — 860x450
  </text>

  <!-- Terminal Content -->
  <g class="terminal-text" transform="translate(30, 80)">
    
    <!-- Line 0: Code definition -->
    <g class="anim-l0">
      <text x="0" y="0">
        <tspan class="c-blue">❯ </tspan>
        <tspan class="c-yellow">@app.tool</tspan>
        <tspan class="c-dim">(</tspan><tspan class="c-white">"Search knowledge base"</tspan><tspan class="c-dim">)</tspan>
        <tspan class="c-purple"> async def </tspan>
        <tspan class="c-green">search</tspan>
        <tspan class="c-dim">(query: </tspan><tspan class="c-blue">str</tspan><tspan class="c-dim">, limit: </tspan><tspan class="c-blue">int</tspan><tspan class="c-dim"> = 10) -&gt; </tspan><tspan class="c-blue">list[dict]</tspan>
      </text>
    </g>

    <!-- Line 1: Header banner -->
    <g class="anim-l1" transform="translate(0, 28)">
      <text x="0" y="0">
        <tspan class="c-dim">[MCP-FORGE]</tspan>
        <tspan class="c-green"> Initializing Forge Engine v1.0.0</tspan>
        <tspan class="c-dim"> — The FastAPI Moment for MCP</tspan>
      </text>
    </g>

    <!-- Line 2: Automatic schema derivation -->
    <g class="anim-l2" transform="translate(0, 56)">
      <text x="0" y="0">
        <tspan class="c-blue">● SCHEMA ENGINE:</tspan>
        <tspan class="c-white"> JSON Schema draft-07 derived automatically from Python type hints</tspan>
      </text>
    </g>

    <!-- Line 3: Transports -->
    <g class="anim-l3" transform="translate(0, 80)">
      <text x="0" y="0">
        <tspan class="c-dim">  └─ Multi-Transport Bindings: </tspan>
        <tspan class="c-green">STDIO [Ready]</tspan>
        <tspan class="c-dim"> • </tspan>
        <tspan class="c-green">SSE / HTTP [Port 8080]</tspan>
      </text>
    </g>

    <!-- Line 4: Client connected -->
    <g class="anim-l4" transform="translate(0, 114)">
      <text x="0" y="0">
        <tspan class="c-purple">● CLIENT CONNECTED:</tspan>
        <tspan class="c-white"> Claude Desktop / Cursor handshake verified via </tspan>
        <tspan class="c-yellow">notifications/initialized</tspan>
      </text>
    </g>

    <!-- Line 5: Tool Call execution -->
    <g class="anim-l5" transform="translate(0, 138)">
      <text x="0" y="0">
        <tspan class="c-dim">[DISPATCH] Invoking tool </tspan>
        <tspan class="c-green">'search'</tspan>
        <tspan class="c-dim"> with inputs: </tspan>
        <tspan class="c-white">{"query": "quantum encryption", "limit": 5}</tspan>
      </text>
    </g>

    <!-- Line 6: Validation output -->
    <g class="anim-l6" transform="translate(0, 172)">
      <text x="0" y="0">
        <tspan class="c-green">✔ VALIDATION PASSED:</tspan>
        <tspan class="c-white"> Pydantic v2 runtime type check succeeded in </tspan>
        <tspan class="c-green">&lt;0.8ms</tspan>
      </text>
    </g>

    <!-- Line 7: Response sent -->
    <g class="anim-l7" transform="translate(0, 196)">
      <text x="0" y="0">
        <tspan class="c-dim">[RESPONSE] Returned 5 ranked documents. Zero handwritten boilerplate.</tspan>
      </text>
    </g>

    <!-- Line 8: Verdict -->
    <g class="anim-l8" transform="translate(0, 230)">
      <text x="0" y="0">
        <tspan class="c-white">Productivity Verdict: </tspan>
        <tspan class="c-green">10x FASTER DEVELOPMENT</tspan>
        <tspan class="c-dim"> | Pure Python | Zero transport friction</tspan>
      </text>
    </g>

    <!-- Line 9: Ready prompt -->
    <g class="anim-l9" transform="translate(0, 260)">
      <text x="0" y="0">
        <tspan class="c-green">❯ </tspan>
        <tspan class="c-dim">mcp-forge listening. Ready to build server tools.</tspan>
        <tspan class="cursor"> █</tspan>
      </text>
    </g>

  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="10" y="457" width="860" height="3" fill="url(#headerGradForge)" rx="1.5"/>
</svg>
